<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>14-age-calculatorr</title>
  </head>
  <body>
    <div
      class="flex flex-col justify-center items-center bg-blue-300 h-screen gap-2"
    >
      <h1 class="text-xl font-bold">Age Calculator</h1>
      <div class="relative">
        <input
          class="border-2 border-black rounded-lg"
          type="text"
          id="my-date"
          placeholder="Pick a date"
        />
        <i class="fa-regular fa-calendar absolute right-2 top-1.5"></i>
        <p id="age_display"></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
