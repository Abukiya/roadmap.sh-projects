<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Tabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
<style>
      button.active {
        background-color: #3b82f6 !important;
        color: white !important;
      }
    </style>
  </head>
  <body class="flex flex-col justify-center items-center bg-blue-300 h-screen">
    <div class="flex gap-4" role="tablist">
      <button
        class="bg-white text-blue-500 hover:bg-blue-500 hover:text-white py-2 px-4 rounded-md active"
        role="tab"
        aria-selected="true"
        aria-controls="tab1"
        id="btn-tab1"
      >
        First Tab
      </button>
      <button
        class="bg-white text-blue-500 hover:bg-blue-500 hover:text-white py-2 px-4 rounded-md"
        role="tab"
        aria-selected="false"
        aria-controls="tab2"
        id="btn-tab2"
      >
        Second Tab
      </button>

      <button
        class="bg-white text-blue-500 hover:bg-blue-500 hover:text-white py-2 px-4 rounded-md"
        role="tab"
        aria-selected="false"
        aria-controls="tab3"
        id="btn-tab3"
      >
        Third Tab
      </button>

      <button
        class="bg-white text-blue-500 hover:bg-blue-500 hover:text-white py-2 px-4 rounded-md"
        role="tab"
        aria-selected="false"
        aria-controls="tab4"
        id="btn-tab4"
      >
        Fourth Tab
      </button>
    </div>
    <div>
      <div
        class="bg-white p-4 rounded-md shadow-md mt-4"
        id="tab1"
        role="tabpanel"
        aria-labelledby="btn-tab1"
      >
        <h2 class="text-xl font-semibold mb-2">First Tab Content</h2>
        <p>This is the content for the first tab.</p>
      </div>
      <div
        class="bg-white p-4 rounded-md shadow-md mt-4 hidden"
        id="tab2"
        role="tabpanel"
        aria-labelledby="btn-tab2"
      >
        <h2 class="text-xl font-semibold mb-2">Second Tab Content</h2>
        <p>This is the content for the second tab.</p>
      </div>
      <div
        class="bg-white p-4 rounded-md shadow-md mt-4 hidden"
        id="tab3"
        role="tabpanel"
        aria-labelledby="btn-tab3"
      >
        <h2 class="text-xl font-semibold mb-2">Third Tab Content</h2>
        <p>This is the content for the third tab.</p>
      </div>
      <div
        class="bg-white p-4 rounded-md shadow-md mt-4 hidden"
        id="tab4"
        role="tabpanel"
        aria-labelledby="btn-tab4"
      >
        <h2 class="text-xl font-semibold mb-2">Fourth Tab Content</h2>
        <p>This is the content for the fourth tab.</p>
      </div>
    </div>

    <script>
      const tabButtons = document.querySelectorAll('[role="tab"]');
      const tabPanels = document.querySelectorAll('[role="tabpanel"]');

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const targetPanel = button.getAttribute("aria-controls");

          tabButtons.forEach((btn) => {
            btn.classList.remove("active");
            btn.setAttribute("aria-selected", "false");
          });
          button.classList.add("active");
          button.setAttribute("aria-selected", "true");

          tabPanels.forEach((panel) => {
            if (panel.id === targetPanel) {
              panel.classList.remove("hidden");
            } else {
              panel.classList.add("hidden");
            }
          });
        });
      });
    </script>
  </body>
</html>
