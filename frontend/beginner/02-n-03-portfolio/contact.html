<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header
      class="bg-gray-800 text-white p-4 flex flex-col items-center md:flex-row md:justify-between"
    >
      <a href="homepage.html" class="text-xl font-bold">Abukiya</a>
      <nav class="space-x-4">
        <a href="homepage.html" class="hover:underline">Home</a>
        <a href="about.html" class="hover:underline">About</a>
        <a href="projects.html" class="hover:underline">Projects</a>  
        <a href="contact.html" class="hover:underline">Contact</a>
      </nav>
    </header>
    <main>
      <h1 class="text-3xl font-bold p-6">Contact Me</h1>
      <p class="text-gray-700 p-6">
        Feel free to reach out to me via email or through the contact form
        below.
      </p>
      <form class="p-6 space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700"
            >Message</label
          >
          <textarea
            id="message"
            name="message"
            rows="4"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          ></textarea>
        </div>
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        >
          Send Message
        </button>
      </form>
    </main>
    <footer>
      <div class="bg-gray-800 text-white p-4 text-center">
        &copy; 2024 Abukiya. All rights reserved.
      </div>
    </footer>
  </body>
</html>
