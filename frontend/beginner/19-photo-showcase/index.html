<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo-Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex justify-center">
    <div class="w-full md:max-w-3xl">
      <header>
        <h1 class="text-2xl text-center">Photo Showcase</h1>
      </header>
      <main>
        <figure>
          <img src="assets/etheral.png" alt="ethereal" />
          <figcaption class="text-center">ethereal</figcaption>
        </figure>
        <figure>
          <img src="assets/catppuccin.png" alt="catppuccin" />
          <figcaption class="text-center">Catppuccin</figcaption>
        </figure>
        <figure>
          <img src="assets/Lupine.png" alt="lupine" />
          <figcaption class="text-center">Lupine</figcaption>
        </figure>
        <figure>
          <img src="assets/nord.png" alt="Nord" />
          <figcaption class="text-center">Nord</figcaption>
        </figure>
        <figure>
          <img src="assets/Pasted image.png" alt="Eveforest" />
          <figcaption class="text-center">Eveforest</figcaption>
        </figure>
        <figure>
          <img src="assets/tokyo-night.png" alt="Tokyo Night" />
          <figcaption class="text-center">Tokyo Night</figcaption>
        </figure>
        <div>
          <video controls poster="assets/tokyo-night.png">
            <source type="video/webm" />
          </video>
        </div>
      </main>
      <footer class="">
        <p class="text-center">&copy 2026 Photo Showcase</p>
      </footer>
    </div>
  </body>
</html>
