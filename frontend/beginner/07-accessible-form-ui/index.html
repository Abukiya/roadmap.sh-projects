<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="flex justify-center items-center h-screen">
    <div
      class="w-full md:max-w-3xl flex flex-col md:flex-row items-center gap-4 p-4 border-2 border-gray-300 rounded-lg"
    >
      <div class="w-full p-4">
        <form class="flex flex-col space-y-4" aria-label="Contact Form">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            placeholder="What shoul we call You"
            name="name"
            required
            class="border border-gray-300 rounded-md p-2"
          />

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="border border-gray-300 rounded-md p-2"
          />

          <label for="password">Enter Password:</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="XXXXXXXX"
              class="w-full border border-gray-300 rounded-md p-2"
            />
            <i
              class="absolute right-3 top-3 text-gray-500 fa-regular fa-eye"
            ></i>
          </div>
          <label for="confirm-password">Confirm Password:</label>
          <div class="relative">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              placeholder="XXXXXXXX"
              class="w-full border border-gray-300 rounded-md p-2"
            />
            <i
              class="absolute right-3 top-3 text-gray-500 fa-regular fa-eye"
            ></i>
          </div>
          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
            type="submit"
          >
            Update Profile
          </button>
        </form>
      </div>
      <div class="w-full md:w-1/2 p-4 flex flex-col gap-4 items-center">
        <div
          class="flex items-center justify-center size-32 border-2 border-l-black border-t-black border-b-black border-r-gray-300 rounded-full"
        >
          <p class="font-mono text-2xl italic">75%</p>
        </div>
        <p class="text-center">Profile completness</p>
        <div class="flex flex-col gap-2 p-4 bg-gray-200 rounded-lg w-full">
          <p class="line-through opacity-50">Crate Account</p>
          <p class="line-through opacity-50">Updaate Roadmap Progress</p>
          <p class="line-through opacity-50">Setup Public Profile</p>
          <p>Complete Your Fisrt Project</p>
          <p>Invite Your Friends</p>
        </div>
      </div>
    </div>
  </body>
</html>
