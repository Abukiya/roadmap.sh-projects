<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact-form</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex justify-center">
    <div class="w-full md:max-w-3xl p-8 m-4 grid gap-4 border-l-2 border-r-2">
      <header class="text-start w-full grid gap-4">
        <h1 class="text-3xl">Acme Support</h1>
        <nav class="flex gap-4">
          <button>Home</button>
          <button>Blog</button>
          <button>About</button>
          <button>Contact</button>
        </nav>
      </header>
      <hr class="border-t border-gray-300" />
      <main class="grid gap-4">
        <h1 class="text-2xl">Contact Us</h1>
        <p>Send us a message and we will get back to you.</p>
        <form
          class="grid gap-2"
          action="https://httpbin.org/post"
          method="post"
        >
          <div class="flex gap-8">
            <label class="s pt-2 text-xl w-1/5" for="full_name"
              >Full Name</label
            >
            <input
              id="full_name"
              name="full_name"
              type="text"
              required
              class="p-2 border-2 w-full rounded-lg border-gray-300 focus:outline-none focus:border-gray-800"
            />
          </div>
          <div class="flex gap-8">
            <label class="w-1/5 pt-2 text-xl" for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              required
              class="p-2 border-2 rounded-lg w-full border-gray-300 focus:outline-none focus:border-gray-800"
            />
          </div>
          <div class="flex gap-8">
            <label class="w-1/5 pt-2 text-xl" for="Subject">Subject</label>
            <select
              class="block w-full rounded-lg border-2 border-gray-300 p-2 focus:outline-none"
              id="Subject"
              name="subject"
            >
              <option class="hover:bg-none" value="">Choose a topic</option>
              <option value="Business">Business</option>
              <option value="issues">issues</option>
              <option value="jop">jop</option>
            </select>
          </div>
          <div class="flex gap-8">
            <label class="w-1/5 pt-2 text-xl" for="msg">Message</label>
            <textarea
              minlength="20"
              id="msg"
              name="msg"
              required
              class="border-2 rounded-lg focus:outline-none w-full h-36 p-2 focus:border-gray-800"
            ></textarea>
          </div>
          <fieldset>
            <legend>How did you hear about us?</legend>
            <div class="pl-4">
              <div class="flex gap-4">
                <input name="choice" type="radio" id="search" value="search" />
                <label for="search">Search</label>
              </div>
              <div class="flex gap-4">
                <input name="choice" type="radio" id="friend" value="friend" />
                <label for="friend">Friend</label>
              </div>
              <div class="flex gap-4">
                <input name="choice" type="radio" id="social" value="social" />
                <label for="social">Social Media</label>
              </div>
            </div>
          </fieldset>
          <div class="flex gap-4 mb-4">
            <input type="checkbox" id="updates" name="up" value="update" />
            <label for="updates">Send me product updates</label>
          </div>
          <button
            class="border-2 w-1/4 p-2 rounded-lg bg-gray-100 hover:bg-gray-200"
            type="submit"
          >
            Send Message
          </button>
        </form>
      </main>
      <hr class="border-t border-gray-300" />
      <footer><p>&copy; 2026 Acme Support</p></footer>
    </div>
  </body>
</html>
